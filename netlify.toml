# Let Netlify fully auto-detect Next.js (it sets the build command, publish
# dir, and injects the official Next.js runtime automatically). We ONLY pin
# the Node version — Next 16 requires Node >= 20.19. Do not set a custom
# [build] command or a [[plugins]] block: either one disables Netlify's
# automatic Next.js runtime and results in a 404 at the root.
[build.environment]
  NODE_VERSION = "22"
